    <div class="hero-glow" aria-hidden="true"></div>
    <div class="shell hero-row">
      <div class="identity">
        <button class="brand-seal" id="secret-seal" type="button" aria-label="Маленький секрет: нажмите три раза"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M11 13c1-4 5-6 9-6s8 2 9 6v14c-3-2-6-2-9 0-3-2-6-2-9 0Z"/><path d="M20 10v17M14 15h3m-3 5h3m6-5h3m-3 5h3"/></svg></button>

        <button class="icon-button" id="theme-toggle" type="button"></button>
      </div>
    </div>
  </header>

  <main class="shell" id="main">
    <section class="next-card" id="next-card" hidden aria-live="polite"></section>

      <button class="today-button" id="today-button" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="M10 1v3m0 12v3M1 10h3m12 0h3"/></svg><span data-i18n="today">Сегодня</span></button>
    </div>
    <nav class="day-tabs" id="day-tabs" aria-label="Дни недели" data-i18n-aria="days.label"><i class="ind" aria-hidden="true"></i></nav>
    <div class="schedule-content" id="schedule-content"></div>
  </main>
  <footer class="foot"><button class="footer-secret" id="secret-cats" type="button" aria-label="Тихий секрет Дымки"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13c-4 3-3 7 1 6 2-1 4-1 6 0 4 1 5-3 1-6-2-2-6-2-8 0Z"/><ellipse cx="5" cy="9" rx="2" ry="3" transform="rotate(-25 5 9)"/><ellipse cx="10" cy="6" rx="2" ry="3"/><ellipse cx="15" cy="6" rx="2" ry="3"/><ellipse cx="20" cy="9" rx="2" ry="3" transform="rotate(25 20 9)"/></svg></button></footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="cat-dialog" class="cat-dialog" aria-labelledby="cat-title">
    <button class="dialog-close" id="cat-close" type="button" aria-label="Закрыть"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
    <button class="cat-sound-toggle" id="cat-sound-toggle" type="button" aria-pressed="true"></button>
    <div class="cat-sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="cat-photo-frame"><div class="cat-photo-viewport" id="cat-photo-viewport"><img id="cat-photo" alt="" width="240" height="180"></div></div>
    <h2 id="cat-title"></h2>
  </dialog>
